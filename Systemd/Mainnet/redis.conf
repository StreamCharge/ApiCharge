# Redis configuration for ApiCharge bare metal deployment
# Optimized for systemd service management

port 6379
bind 127.0.0.1
protected-mode yes

# Don't daemonize - systemd manages the process
daemonize no

# Data directory (must match ReadWritePaths in systemd unit)
dir /var/lib/apicharge/redis

# Persistence
appendonly yes
appendfsync everysec

# Memory limits
maxmemory 512mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
